{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><h1>Notifications</h1><p class="muted">Updates on your incidents, SLAs and escalations.</p></div></div><section class="card">{% for n in notifications %}<div class="notice"><span class="nicon"><svg class="ic"><use href="#i-bell"/></svg></span><b>{{n.title}}</b><p>{{n.message}}</p><small>{{n.created_at[:16].replace('T',' ')}}</small></div>{% else %}<p class="empty">You're all caught up.</p>{% endfor %}</section>{% endblock %}
